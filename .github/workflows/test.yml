name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax checks
        run: |
          python -m py_compile bin/claude-accounts dashboard/monitor.py dashboard/reset_cards.py scripts/install.py
          sh -n bin/claude-auto bin/claude-quota
          node --check dashboard/static/app.js
      - name: Unit, PTY, HTTP and clean-install tests (offline fixtures)
        run: python -m unittest discover -s tests -v
      - name: Verify distributable files
        run: python scripts/check_release.py
